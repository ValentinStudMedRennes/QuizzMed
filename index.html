<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM de révision</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d1d1b;--muted:#6b6a63;--accent:#3b5bdb;--ok:#2f9e44;--ko:#e03131;--border:#dddbd2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--text:#ececea;--muted:#9a9a95;--accent:#748ffc;--ok:#51cf66;--ko:#ff6b6b;--border:#38383e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--text:#ececea;--muted:#9a9a95;--accent:#748ffc;--ok:#51cf66;--ko:#ff6b6b;--border:#38383e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0}
p.sub{color:var(--muted);margin-top:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.theme{background:var(--bg);color:var(--text);border:2px solid var(--border);text-align:left;padding:12px}
.theme.sel{border-color:var(--accent)}
.theme small{display:block;color:var(--muted)}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin:8px 0;cursor:pointer}
label.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
label.opt.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 15%,transparent)}
label.opt.missed{border-color:var(--ok);border-style:dashed}
input[type=number]{width:64px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.hint{color:var(--muted);font-size:.9rem}
.res{font-weight:600;margin-top:8px}
.hidden{display:none}
#bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
#bar div{height:100%;background:var(--accent);width:0;transition:width .3s}
</style>
</head>
<body>
<main>
<h1>QCM de révision</h1>
<p class="sub">Choisis un thème : le site génère un QCM aléatoire, avec 0 à 5 bonnes réponses par question.</p>
<div id="load" class="hint">Chargement des questions…</div>

<section id="setup">
<div class="card">
<strong>1. Thème</strong>
<div class="themes" id="themes"></div>
</div>
<div class="card">
<strong>2. Options</strong>
<div class="row">Nombre de questions : <input type="number" id="nq" value="40" min="1"> <span class="hint" id="max"></span></div>
<div class="row">Propositions par question : <input type="number" id="total" value="5" min="2" max="10"></div>
<div class="row">Bonnes réponses : de <input type="number" id="kmin" value="0" min="0" max="5"> à <input type="number" id="kmax" value="5" min="0" max="5"></div>
<button id="start">Générer le QCM</button>
<div id="err" class="res" style="color:var(--ko)"></div>
</div>
</section>

<section id="quiz" class="hidden">
<div id="bar"><div></div></div>
<div class="card">
<div class="hint" id="count"></div>
<h2 id="q" style="font-size:1.2rem"></h2>
<div class="hint">Coche toutes les bonnes réponses (il peut n’y en avoir aucune).</div>
<div id="opts"></div>
<div id="fb" class="res"></div>
<div class="row"><button id="valid">Valider</button><button id="next" class="hidden">Suivant</button></div>
</div>
</section>

<section id="end" class="hidden">
<div class="card"><h2 id="score"></h2><div id="miss" class="hint"></div>
<div class="row"><button id="again">Refaire un QCM</button><button class="alt" id="back">Changer de thème</button></div></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const DATA_DIR="data/";           // dossier des fichiers de questions
let themes=[],theme=null,quiz=[],i=0,score=0,done=false,wrong=[];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=rnd(0,j);[a[j],a[k]]=[a[k],a[j]]}return a}

async function getJSON(name){
  const r=await fetch(DATA_DIR+name,{cache:"no-store"});
  if(!r.ok)throw new Error("fichier « "+name+" » introuvable ("+r.status+")");
  try{return await r.json()}catch(e){throw new Error("« "+name+" » n’est pas un JSON valide : "+e.message)}
}
function clean(list,file,warns){
  if(!Array.isArray(list)){warns.push(file+" : doit contenir une liste [ … ]");return[]}
  return list.filter((x,n)=>{
    const ok=x&&typeof x.question==="string"&&Array.isArray(x.bonnes)&&Array.isArray(x.mauvaises)&&(x.bonnes.length+x.mauvaises.length)>0;
    if(!ok)warns.push(file+" : question n°"+(n+1)+" ignorée (champs question / bonnes / mauvaises incorrects)");
    return ok;
  }).map(x=>({question:x.question,bonnes:[...new Set(x.bonnes.map(String))],mauvaises:[...new Set(x.mauvaises.map(String))]}));
}
async function init(){
  const warns=[];
  try{
    const list=await getJSON("themes.json");
    for(const t of list){
      try{themes.push({nom:t.nom,questions:clean(await getJSON(t.fichier),t.fichier,warns)})}
      catch(e){warns.push(e.message)}
    }
  }catch(e){
    $("load").style.color="var(--ko)";
    $("load").textContent="Impossible de charger les données : "+e.message+". Si tu ouvres le fichier directement depuis ton disque, lance un petit serveur local (python3 -m http.server) ou héberge le dossier en ligne.";
    return;
  }
  if(themes.length>1)themes.push({nom:"Tous les thèmes",questions:themes.flatMap(t=>t.questions)});
  themes.forEach(t=>{
    const b=document.createElement("button");b.className="theme";
    const n=document.createElement("strong");n.textContent=t.nom;
    const s=document.createElement("small");s.textContent=t.questions.length+" question(s)";
    b.append(n,s);b.onclick=()=>pick(t,b);t.el=b;$("themes").append(b);
  });
  $("load").textContent=warns.length?"⚠ "+warns.join(" — "):"";
  $("load").style.color="var(--ko)";
  if(themes.length)pick(themes[0],themes[0].el);
}
function pick(t,b){
  theme=t;
  document.querySelectorAll(".theme").forEach(x=>x.classList.toggle("sel",x===b));
  $("max").textContent="(max. "+t.questions.length+" pour ce thème)";
  $("err").textContent="";
}
function build(q,total,kmin,kmax){
  const G=q.bonnes.length,M=q.mauvaises.length;
  total=Math.min(total,G+M);
  let lo=Math.max(kmin,total-M,0),hi=Math.min(kmax,G,total);
  if(lo>hi){lo=Math.max(0,total-M);hi=Math.min(G,total)}
  const k=rnd(lo,hi);
  const good=shuffle(q.bonnes).slice(0,k).map(t=>({t,ok:true}));
  const bad=shuffle(q.mauvaises).slice(0,total-k).map(t=>({t,ok:false}));
  return{question:q.question,opts:shuffle([...good,...bad])};
}
function start(){
  if(!theme||!theme.questions.length){$("err").textContent="Choisis un thème contenant des questions.";return}
  const total=+$("total").value||5;
  let kmin=Math.max(0,Math.min(5,+$("kmin").value||0)),kmax=Math.max(0,Math.min(5,+$("kmax").value));
  if(isNaN(kmax))kmax=5;if(kmin>kmax)kmin=kmax;
  const nq=Math.max(1,Math.min(+$("nq").value||40,theme.questions.length));
  quiz=shuffle(theme.questions).slice(0,nq).map(q=>build(q,total,kmin,kmax));
  i=0;score=0;wrong=[];
  $("setup").classList.add("hidden");$("end").classList.add("hidden");$("quiz").classList.remove("hidden");
  show();
}
function show(){
  done=false;const q=quiz[i];
  $("count").textContent="Question "+(i+1)+" / "+quiz.length;
  $("bar").firstElementChild.style.width=(i/quiz.length*100)+"%";
  $("q").textContent=q.question;$("fb").textContent="";$("opts").innerHTML="";
  q.opts.forEach(o=>{
    const l=document.createElement("label");l.className="opt";
    const c=document.createElement("input");c.type="checkbox";
    const s=document.createElement("span");s.textContent=o.t;
    l.append(c,s);$("opts").append(l);
  });
  $("valid").classList.remove("hidden");$("next").classList.add("hidden");
}
function validate(){
  if(done)return;done=true;
  const q=quiz[i];let perfect=true;
  [...$("opts").children].forEach((l,n)=>{
    const c=l.querySelector("input"),o=q.opts[n];c.disabled=true;
    if(c.checked&&o.ok)l.classList.add("good");
    else if(c.checked&&!o.ok){l.classList.add("bad");perfect=false}
    else if(!c.checked&&o.ok){l.classList.add("missed");perfect=false}
  });
  const nb=q.opts.filter(o=>o.ok).length;
  if(perfect)score++;else wrong.push(q.question);
  $("fb").style.color=perfect?"var(--ok)":"var(--ko)";
  $("fb").textContent=(perfect?"✓ Correct !":"✗ Incorrect.")+" "+(nb===0?"Il n’y avait aucune bonne réponse.":nb+" bonne(s) réponse(s) attendue(s).");
  $("valid").classList.add("hidden");$("next").classList.remove("hidden");
  $("next").textContent=i===quiz.length-1?"Voir le score":"Suivant";
}
function next(){
  if(i<quiz.length-1){i++;show();return}
  $("quiz").classList.add("hidden");$("end").classList.remove("hidden");
  $("score").textContent="Score : "+score+" / "+quiz.length+" ("+Math.round(score/quiz.length*100)+" %)";
  $("miss").textContent=wrong.length?"À revoir : "+wrong.join(" · "):"Sans faute, bravo !";
}
$("start").onclick=start;$("valid").onclick=validate;$("next").onclick=next;
$("again").onclick=start;
$("back").onclick=()=>{$("end").classList.add("hidden");$("setup").classList.remove("hidden")};
init();
</script>
</body>
</html>
